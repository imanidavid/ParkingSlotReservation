<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Manage Parking Slots - Admin</title>
    <link rel="stylesheet" href="css/style.css"/>
    <style type="text/css">
        .slot-table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        .slot-table th, .slot-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .slot-table th { background-color: #333; color: white; }
        .slot-table tr.available td { background-color: #d4edda; }
        .slot-table tr.reserved td { background-color: #fff3cd; }
        .slot-table tr.occupied td { background-color: #f8d7da; }
    </style>
</h:head>
<f:view>
    <h1>Manage Parking Slots - Admin</h1>

    <h:form>
        <h:commandButton value="Logout"
                         action="#{userController.logout()}"
                         style="float: right; background: #dc3545; color: white; padding: 6px 14px; border: none; cursor: pointer; border-radius: 3px;"/>
        <div style="clear: both;"></div>
    </h:form>

    <h:form>
        <!-- External CSS link added in head -->
        <!-- Inline CSS: style attributes on components -->

        <h2>Add New Parking Slot</h2>

        <h:panelGrid columns="3" style="border: 1px solid #ddd; padding: 20px; margin-bottom: 20px;">

            <h:outputLabel value="Slot Number:" style="color: #333; font-weight: bold;"/>
            <h:inputText id="slotNumber" value="#{parkingSlotController.newSlot.slotNumber}"
                         required="true"
                         style="width: 200px; padding: 5px; border: 1px solid #ccc;"
                         label="Slot Number">
                <f:validateLength minimum="3" maximum="20"/>
            </h:inputText>
            <h:message style="color:red;" for="slotNumber"/>

            <h:outputLabel value="Location:" style="color: #333; font-weight: bold; margin-top: 10px;"/>
            <h:inputText id="location" value="#{parkingSlotController.newSlot.location}"
                         required="true"
                         style="width: 200px; padding: 5px; border: 1px solid #ccc; margin-top: 5px;"
                         label="Location">
                <f:validateLength minimum="3" maximum="100"/>
            </h:inputText>
            <h:message style="color:red;" for="location"/>

            <h:outputLabel value="Vehicle Type:" style="color: #333; font-weight: bold; margin-top: 10px;"/>
            <h:inputText id="vehicleType" value="#{parkingSlotController.newSlot.vehicleType}"
                         required="true"
                         style="width: 200px; padding: 5px; border: 1px solid #ccc; margin-top: 5px;"
                         label="Vehicle Type">
                <f:validateLength minimum="2" maximum="50"/>
            </h:inputText>
            <h:message style="color:red;" for="vehicleType"/>

            <h:commandButton value="Add Slot"
                             style="background: #28a745; color: white; padding: 8px 15px; border: none; cursor: pointer; margin-top: 10px; inline-add-btn"
                             action="#{parkingSlotController.addSlot()}"/>
            <br/>

            <h:outputLabel value="Status:" style="color: #333; font-weight: bold; margin-top: 15px;"/>
            <h:selectOneMenu value="#{parkingSlotController.newSlot.status}"
                             style="width: 200px; padding: 5px; border: 1px solid #ccc; margin-top: 5px;">
                <f:selectItems value="#{parkingSlotController.statusOptions}"/>
            </h:selectOneMenu>
        </h:panelGrid>

        <h2>Parking Slots Table</h2>

        <h:dataTable value="#{parkingSlotController.getAllSlots()}" var="slot" border="1"
                     style="width: 100%; margin-top: 20px;"
                     class="slot-table">
            <h:column>
                <f:facet name="header">Slot Number</f:facet>
                #{slot.slotNumber}
            </h:column>
            <h:column>
                <f:facet name="header">Location</f:facet>
                #{slot.location}
            </h:column>
            <h:column>
                <f:facet name="header">Vehicle Type</f:facet>
                #{slot.vehicleType}
            </h:column>
            <h:column>
                <f:facet name="header">Status</f:facet>
                <h:outputText value="#{slot.status}" style="color: #{slot.status eq 'Available' ? 'green' : slot.status eq 'Reserved' ? 'orange' : 'red'}"/>
            </h:column>
            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:commandLink value="Update" style="margin-right: 5px;"
                               action="#{parkingSlotController.prepareUpdate(slot.slotId)}"/>
                <h:commandLink value="Delete" style="color: red;"
                               onclick="return confirm('Are you sure you want to delete this slot?')"
                               action="#{parkingSlotController.deleteSlot(slot.slotId)}"/>
            </h:column>
        </h:dataTable>

        <h:panelGroup rendered="#{not empty parkingSlotController.updateSlot.slotId}">
            <h2>Edit Parking Slot</h2>
            <h:panelGrid columns="2" style="border: 1px solid #ddd; padding: 20px; margin-top: 20px;">
                <h:outputLabel value="Slot Number:" style="color: #333; font-weight: bold;"/>
                <h:inputText value="#{parkingSlotController.updateSlot.slotNumber}"
                             style="width: 200px; padding: 5px; border: 1px solid #ccc;"/>
                <h:outputLabel value="Location:" style="color: #333; font-weight: bold;"/>
                <h:inputText value="#{parkingSlotController.updateSlot.location}"
                             style="width: 200px; padding: 5px; border: 1px solid #ccc;"/>
                <h:outputLabel value="Vehicle Type:" style="color: #333; font-weight: bold;"/>
                <h:inputText value="#{parkingSlotController.updateSlot.vehicleType}"
                             style="width: 200px; padding: 5px; border: 1px solid #ccc;"/>
                <h:outputLabel value="Status:" style="color: #333; font-weight: bold;"/>
                <h:selectOneMenu value="#{parkingSlotController.updateSlot.status}"
                                 style="width: 200px; padding: 5px; border: 1px solid #ccc;">
                    <f:selectItems value="#{parkingSlotController.statusOptions}"/>
                </h:selectOneMenu>
                <h:panelGroup/>
                <h:commandButton value="Save Changes"
                                 styleClass="add-btn"
                                 action="#{parkingSlotController.updateSlot()}"/>
            </h:panelGrid>
        </h:panelGroup>
    </h:form>
</f:view>
</html>
