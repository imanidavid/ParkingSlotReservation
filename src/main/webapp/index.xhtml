<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Parking Slot Reservation System</title>
    <link rel="stylesheet" href="css/style.css"/>
    <style type="text/css">
        .login-box { border: 1px solid #ddd; padding: 20px; width: 320px; background: #f9f9f9; margin: 20px auto; }
        .login-box label { display: block; font-weight: bold; color: #555; margin-top: 10px; }
        .login-box input[type="text"], .login-box input[type="password"] { width: 100%; padding: 8px; border: 1px solid #ccc; }
        .login-btn { background-color: #007bff; color: white; padding: 8px 15px; border: none; cursor: pointer; margin-top: 15px; }
        .links { margin-top: 15px; }
    </style>
</h:head>
<f:view>
    <h1>Parking Slot Reservation System</h1>

    <h:form>
        <h:panelGrid columns="1" styleClass="login-box">
            <h:outputLabel value="Email:" for="loginEmail"/>
            <h:inputText id="loginEmail"
                         value="#{userController.newUser.email}"
                         required="true"
                         label="Email">
                <f:validateLength minimum="5" maximum="100"/>
            </h:inputText>
            <h:message style="color:red; font-size: 12px;" for="loginEmail"/>

            <h:outputLabel value="Password:" for="loginPassword"/>
            <h:inputSecret id="loginPassword"
                         value="#{userController.newUser.password}"
                         required="true"
                         label="Password">
                <f:validateLength minimum="6" maximum="20"/>
            </h:inputSecret>
            <h:message style="color:red; font-size: 12px;" for="loginPassword"/>

            <h:commandButton value="Login"
                             styleClass="login-btn"
                             action="#{userController.login()}"/>
            <h:messages globalOnly="true" style="color:red; font-size:12px;"/>

            <h:panelGroup styleClass="links">
                <h:outputText value="New user? " style="color:#666;"/>
                <h:commandLink value="Register" action="user-registration"/>
                <h:outputText value=" | " style="color:#666;"/>
                <h:commandLink value="Admin" action="admin-slots"/>
            </h:panelGroup>
        </h:panelGrid>
    </h:form>
</f:view>
</html>
