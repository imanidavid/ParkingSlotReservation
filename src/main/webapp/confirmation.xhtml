<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Reservation Confirmation</title>
    <link rel="stylesheet" href="css/style.css"/>
</h:head>
<f:view>
    <h1>Reservation Confirmation</h1>

    <h:form>
    <h:panelGroup rendered="#{not empty reservationController.lastReservation.reservationId}">
        <h:outputLabel
                value="Thank you for reserving parking slot #{reservationController.lastReservation.slot.slotNumber}
located at #{reservationController.lastReservation.slot.location}! Your reservation is from "/>
        <h:outputText value="#{reservationController.lastReservation.startTime}">
            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
        </h:outputText>
        <h:outputText value=" to "/>
        <h:outputText value="#{reservationController.lastReservation.endTime}">
            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
        </h:outputText>
        <br/><br/>
        <h:commandLink value="Back to Dashboard" action="user-dashboard?faces-redirect=true"/>
        <h:outputText value=" | " style="color: #666;"/>
        <h:commandLink value="Logout" action="#{userController.logout()}" style="color: red;"/>
    </h:panelGroup>

    <h:outputText
            value="No reservation was just made. Please return to the dashboard to reserve a slot."
            rendered="#{empty reservationController.lastReservation.reservationId}"
            style="color: #666;"/>
    </h:form>
</f:view>
</html>
