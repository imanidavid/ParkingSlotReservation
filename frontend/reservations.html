<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My reservations · Karita</title>
    <meta name="color-scheme" content="light dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
    />

    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/reservations.css" />

    <script src="scripts/theme.js"></script>
  </head>
  <body>
    <header class="appbar" data-appbar data-active="reservations"></header>

    <main class="mine" id="mine" aria-busy="true">
      <h1 class="sr-only">My reservations</h1>

      <section aria-labelledby="upcoming-label">
        <h2 class="section-label" id="upcoming-label">
          <span>Upcoming</span>
          <span class="section-label__count" id="upcoming-count"></span>
        </h2>
        <ol class="rstubs" id="upcoming-list"></ol>
        <p class="empty" id="upcoming-empty" hidden>
          No upcoming reservations. <a class="link" href="browse.html">Browse facilities</a>
        </p>
      </section>

      <section id="past" aria-labelledby="past-label">
        <h2 class="section-label" id="past-label">
          <span>Past</span>
          <span class="section-label__count" id="past-count"></span>
        </h2>
        <div class="table-wrap">
          <table class="table table--past" id="past-table">
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Slot</th>
                <th scope="col">Facility</th>
                <th scope="col" class="num">Amount</th>
                <th scope="col" class="col-status">Status</th>
              </tr>
            </thead>
            <tbody id="past-body"></tbody>
          </table>
        </div>
        <p class="empty" id="past-empty" hidden>No past reservations yet.</p>
      </section>

      <p class="empty error-text" id="load-error" role="alert" hidden></p>
    </main>

    <script src="scripts/karita.js"></script>
    <script src="scripts/reservations.js"></script>
  </body>
</html>
