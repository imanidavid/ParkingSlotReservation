spring.application.name=karita

# ---- server -------------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=KARITA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-stacktrace=never

# ---- front end ------------------------------------------------------------------
# The pages, styles and scripts. Relative to where the app is started (backend/).
karita.frontend-dir=${FRONTEND_DIR:../frontend}
spring.web.resources.static-locations=file:${karita.frontend-dir}/
spring.web.resources.cache.cachecontrol.no-cache=true

# ---- database -----------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:karita}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:3002}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Kigali
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true

# ---- messaging (RabbitMQ) -----------------------------------------------------
# Notification events (confirmation, receipt, cancellation) are published to the
# karita.events topic exchange and consumed by the email/SMS listeners.
# Set karita.notifications.enabled=false to run without a broker.
karita.notifications.enabled=${NOTIFICATIONS:true}
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
# Don't wedge a thread for a minute when the broker is unreachable.
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s

# ---- operations log (MongoDB) -------------------------------------------------
# Staff actions and sent notifications are append-only documents, so they live in
# MongoDB rather than beside the relational reservation data.
# Set karita.audit.enabled=false to run without MongoDB.
karita.audit.enabled=${AUDIT:true}
# Spring Boot 4 reads the connection from spring.mongodb.*, not spring.data.mongodb.*,
# and defaults it to mongodb://localhost/test — so setting the old property leaves
# every document in a database called "test". The name goes in the URI.
# serverSelectionTimeoutMS matters: the driver's 30s default means every audited
# admin action would block for half a minute before succeeding while MongoDB is
# down. Two seconds keeps a log outage from feeling like an application outage.
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/karita_ops?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
# Off on purpose: Spring Data builds indexes during startup, and that connects to
# MongoDB — so an unavailable log database would stop the whole app from booting.
# OpsIndexes creates them after startup instead, inside a try/catch.
spring.data.mongodb.auto-index-creation=false

# ---- OAuth2 sign-in -----------------------------------------------------------
# Google sign-in turns on only when a client id and secret are present. They are
# deliberately NOT in this file: an empty client-id doesn't disable a
# registration, it fails validation and stops the app from starting, and secrets
# don't belong in version control either way.
#
# To enable it, copy oauth.properties.example to backend/oauth.properties (which
# .gitignore excludes) and fill in the two values from the Google Cloud console.
# Authorised redirect URI: http://localhost:8080/login/oauth2/code/google
spring.config.import=optional:file:${KARITA_OAUTH_CONFIG:./oauth.properties}

# ---- app ----------------------------------------------------------------------
karita.timezone=Africa/Kigali
# Seed demo facilities, accounts and bookings when the database is empty.
karita.seed=true
