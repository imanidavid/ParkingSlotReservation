# Used by tests/smoke.mjs and backend tests: a throwaway database rebuilt each run.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_TEST_NAME:karita_test}
spring.jpa.hibernate.ddl-auto=create-drop

# No broker needed for the test suites: the publish call sites still run, but the
# no-op publisher handles them. The messaging itself is covered separately by
# NotificationMessagingTest, which skips when RabbitMQ isn't reachable.
karita.notifications.enabled=false

# The API and browser suites don't need MongoDB either; OperationsLogTest covers
# the document side on its own and skips when no server is listening.
karita.audit.enabled=false
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/karita_ops_test?serverSelectionTimeoutMS=2000}
